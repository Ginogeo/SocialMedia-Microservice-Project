apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  selector:
    app: my-app # Matches the label defined in the deployment above
  ports:
    - protocol: TCP
      port: 80       # The port the outside world connects to
      targetPort: 8080 # Routes that traffic to port 8080 inside the container
  type: ClusterIP # Use 'LoadBalancer' instead if deploying to AWS/GCP/Azure for a public IP
